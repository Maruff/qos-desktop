name: qos Desktop release

# A v* tag builds qos Desktop and its qos-x11 command package, both signed with
# the qos key, and publishes them as a GitHub release:
#
#   qos-desktop.apk   the sharedUid flavour, which runs as part of qos itself
#   qos-x11.deb       the termux-x11 command; its loader trusts only the qos key
#   sha256sums.txt
#
# The names stay fixed so qos can always fetch releases/latest/download/<name>.
# versionCode comes from the tag: major*10000 + minor*100 + patch.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - name: Fetch submodules
        run: git submodule update --init --recursive --jobs 8 --depth 1

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build signed APK and companion package
        env:
          QOS_KEYSTORE_BASE64: ${{ secrets.QOS_KEYSTORE_BASE64 }}
          QOS_KEYSTORE_PASSWORD: ${{ secrets.QOS_KEYSTORE_PASSWORD }}
          QOS_KEY_ALIAS: ${{ secrets.QOS_KEY_ALIAS }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${version%%[-+]*}"
          export QOS_VERSION_NAME="$version"
          export QOS_VERSION_CODE=$((major * 10000 + minor * 100 + patch))
          export QOS_KEYSTORE_FILE="$RUNNER_TEMP/qos-release.p12"
          printf '%s' "$QOS_KEYSTORE_BASE64" | base64 -d > "$QOS_KEYSTORE_FILE"
          ./gradlew :lorie-app:assembleSharedUidDebug :shell-loader:buildCompanionPackage
          rm -f "$QOS_KEYSTORE_FILE"

          mkdir dist
          cp lorie-app/build/outputs/apk/sharedUid/debug/termux-x11-universal-sharedUid-debug.apk dist/qos-desktop.apk
          cp shell-loader/build/outputs/companion/qos-x11-*-all.deb dist/qos-x11.deb
          (cd dist && sha256sum * > sha256sums.txt && cat sha256sums.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "qos Desktop $GITHUB_REF_NAME" \
            --notes "qos Desktop shows the X11 desktop for qos. Install qos first, then qos-desktop.apk; both are signed with the qos key, so qos Desktop runs as part of qos. qos-x11.deb provides the termux-x11 command and is installed by qos-desktop inside qos."
